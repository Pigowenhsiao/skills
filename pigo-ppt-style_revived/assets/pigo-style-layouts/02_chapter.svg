<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Pigo Style Chapter Page Template -->
  
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Top decorative bar -->
  <rect x="0" y="0" width="1280" height="8" fill="#3B82F6"/>
  
  <!-- Left accent -->
  <rect x="60" y="300" width="6" height="120" rx="3" fill="#3B82F6"/>
  
  <!-- Chapter number -->
  <text x="100" y="320" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#6B7280">
    CHAPTER [NUMBER]
  </text>
  
  <!-- Chapter title -->
  <text x="100" y="380" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700" fill="#111827">
    [CHAPTER TITLE]
  </text>
  
  <!-- Page number -->
  <text x="640" y="680" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
    [PAGE]
  </text>
</svg>