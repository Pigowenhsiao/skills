<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Pigo Style Ending Page Template -->
  <defs>
    <linearGradient id="bgGradEnd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGradEnd)"/>
  
  <!-- Top decorative bar -->
  <rect x="0" y="0" width="1280" height="8" fill="#3B82F6"/>
  
  <!-- Main message -->
  <text x="640" y="280" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    [KEY MESSAGE]
  </text>
  
  <!-- Call to action -->
  <text x="640" y="380" font-family="Inter, Arial, sans-serif" font-size="20" fill="#6B7280" text-anchor="middle">
    [CALL TO ACTION]
  </text>
  
  <!-- Contact/footer -->
  <text x="640" y="550" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">
    Pigo | contact@pigo.com
  </text>
  
  <!-- Page number -->
  <text x="640" y="680" font-family="Inter, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
    [PAGE]
  </text>
</svg>